AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  mind-kernel-mcp
  
  Serverless Mind Kernel MCP Server backed by DynamoDB and GitHub.

Parameters:
  RepoOwner:
    Type: String
    Description: Repository Owner
    Default: mind-kernel
  RepoName:
    Type: String
    Description: Repository Name
    Default: mind-kernel

Resources:
  # DynamoDB Table for User Secrets (userId -> githubToken)
  UserSecrets:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserSecrets
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Cognito User Pool
  MindKernelUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  # Cognito User Pool Client
  MindKernelUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-client
      UserPoolId: !Ref MindKernelUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - https://chatgpt.com/connector_platform_oauth_redirect
        - https://platform.openai.com/apps-manage/oauth
      LogoutURLs:
        - https://chatgpt.com
      SupportedIdentityProviders:
        - COGNITO

  # Cognito User Pool Domain
  MindKernelUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub mind-kernel-mcp-${AWS::AccountId}
      UserPoolId: !Ref MindKernelUserPool

  # Lambda Function
  MindKernelFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: prod
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 180 # Longer timeout for SSE
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Environment:
        Variables:
          REPO_OWNER: !Ref RepoOwner
          REPO_NAME: !Ref RepoName
          DYNAMODB_TABLE_NAME: !Ref UserSecrets
          AWS_LWA_INVOKE_MODE: response_stream
          COGNITO_USER_POOL_ID: !Ref MindKernelUserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSecrets

Outputs:
  MindKernelFunctionUrl:
    Description: "Lambda Function URL"
    Value: !GetAtt MindKernelFunctionUrl.FunctionUrl
  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref MindKernelUserPool
  CognitoClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref MindKernelUserPoolClient
  CognitoDomain:
    Description: "Cognito Domain"
    Value: !Sub "https://mind-kernel-mcp-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
